<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Watch App Active State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#6664e4",
                        "secondary": "#006e28",
                        "primary-fixed": "#d8e2ff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f1f0f5",
                        "outline": "#717786",
                        "on-secondary-container": "#00732a",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#fefcff",
                        "surface-container": "#eeedf3",
                        "tertiary-fixed": "#e2dfff",
                        "on-secondary-fixed": "#002107",
                        "on-tertiary-fixed-variant": "#3631b4",
                        "surface-variant": "#e3e2e7",
                        "on-tertiary-container": "#fffbff",
                        "surface-tint": "#005bc1",
                        "outline-variant": "#c1c6d7",
                        "on-background": "#1a1b1f",
                        "on-surface-variant": "#414755",
                        "surface-container-high": "#e9e7ed",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001a41",
                        "on-secondary-fixed-variant": "#00531c",
                        "tertiary-fixed-dim": "#c2c1ff",
                        "surface-container-low": "#f4f3f8",
                        "secondary-fixed": "#72fe88",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-dim": "#dad9df",
                        "surface-container-highest": "#e3e2e7",
                        "secondary-fixed-dim": "#53e16f",
                        "on-primary-fixed-variant": "#004493",
                        "surface-bright": "#faf9fe",
                        "inverse-primary": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#0058bc",
                        "surface": "#faf9fe",
                        "on-surface": "#1a1b1f",
                        "secondary-container": "#6ffb85",
                        "on-tertiary-fixed": "#0c006a",
                        "primary-container": "#0070eb",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f3034",
                        "background": "#faf9fe",
                        "on-error": "#ffffff",
                        "tertiary": "#4c4aca",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "watch": "40px"
                    },
                    "spacing": {
                        "stack-gap": "1rem",
                        "section-padding": "1.5rem",
                        "gutter-card": "0.75rem",
                        "margin-main": "1rem"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "caption": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline": ["Inter"],
                        "watch-title": ["Playfair Display", "serif"]
                    },
                    "fontSize": {
                        "title-md": ["20px", {"lineHeight": "25px", "letterSpacing": "-0.2px", "fontWeight": "600"}],
                        "body-sm": ["15px", {"lineHeight": "20px", "letterSpacing": "-0.2px", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "16px", "letterSpacing": "0px", "fontWeight": "400"}],
                        "body-lg": ["17px", {"lineHeight": "22px", "letterSpacing": "-0.4px", "fontWeight": "400"}],
                        "display": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.4px", "fontWeight": "700"}],
                        "label-caps": ["13px", {"lineHeight": "18px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                        "headline": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.3px", "fontWeight": "600"}],
                        "watch-header": ["14px", {"fontWeight": "600"}],
                        "watch-time": ["14px", {"fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .watch-container {
            width: 198px;
            height: 242px;
            background-color: #000;
            border-radius: 40px;
            border: 2px solid #333; /* subtle bezel */
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="watch-container">
<!-- Header -->
<div class="flex justify-between items-start mb-6">
<span class="font-watch-title text-[14px] font-semibold text-white leading-tight max-w-[100px] tracking-tight">Calle del Mar 12</span>
<span class="font-body-sm text-[14px] text-white">10:09</span>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-auto mb-2">
<!-- Gate Button (Open/Active state needing closure) -->
<button class="w-full bg-error text-on-error rounded-full py-3 px-4 flex items-center justify-start gap-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">cancel</span>
<span class="font-label-caps text-label-caps whitespace-nowrap">Close Gate</span>
</button>
<!-- Door Button (Unlocked/Active state needing lock) -->
<button class="w-full bg-primary text-on-primary rounded-full py-3 px-4 flex items-center justify-start gap-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">lock</span>
<span class="font-label-caps text-label-caps whitespace-nowrap">Lock Door</span>
</button>
</div>
</div>
</body></html>
